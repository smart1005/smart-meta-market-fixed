<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel — Smart MetaMarket</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .auth-container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .auth-box {
        width: 100%;
        max-width: 400px;
      }

      .auth-box h2 {
        margin-bottom: 6px;
      }

      .auth-box p {
        margin-bottom: 24px;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        display: block;
        font-size: 0.85rem;
        color: var(--subtext);
        margin-bottom: 6px;
      }

      .dashboard-header {
        background: var(--card);
        border-bottom: 1px solid var(--border);
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
      }

      .dashboard-header h3 {
        font-size: 1rem;
      }

      .dashboard-nav {
        display: flex;
        overflow-x: auto;
        gap: 8px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--card);
        position: fixed;
        top: 57px;
        left: 0;
        right: 0;
        z-index: 999;
      }

      .dashboard-nav::-webkit-scrollbar {
        display: none;
      }

      .dash-tab {
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
        border: 1px solid var(--border);
        background: none;
        color: var(--subtext);
        transition: all 0.3s;
      }

      .dash-tab.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .dashboard-content {
        padding-top: 120px;
        padding-bottom: 30px;
        padding-left: 20px;
        padding-right: 20px;
      }

      .stat-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-bottom: 24px;
      }

      .stat-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        text-align: center;
      }

      .stat-card .stat-number {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--primary);
      }

      .stat-card .stat-label {
        font-size: 0.8rem;
        color: var(--subtext);
        margin-top: 4px;
      }

      .btn-sm {
        padding: 6px 12px;
        font-size: 0.75rem;
        border-radius: 6px;
      }

      .btn-danger {
        background: #e74c3c;
        color: white;
        border: none;
        cursor: pointer;
      }

      .search-bar {
        margin-bottom: 16px;
      }

      .table-wrap {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
      }

      th {
        text-align: left;
        padding: 12px 14px;
        color: var(--subtext);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }

      td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }

      tr:last-child td {
        border-bottom: none;
      }

      .status-badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: capitalize;
      }

      .status-active {
        background: rgba(16, 185, 129, 0.15);
        color: var(--success, #10b981);
      }

      .status-inactive {
        background: rgba(154, 154, 149, 0.15);
        color: var(--subtext);
      }

      .status-suspended {
        background: rgba(231, 76, 60, 0.15);
        color: #e74c3c;
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <!-- Auth Gate (shown when not logged in, or logged in as non-admin) -->
    <div id="auth-gate">
      <div class="auth-container">
        <div class="auth-box">
          <div
            class="navbar-logo"
            style="font-size: 1.5rem; margin-bottom: 24px"
          >
            Smart<span style="color: var(--text)">Meta</span>Market
          </div>
          <h2>Admin Login</h2>
          <p>Sign in with an admin or superAdmin account</p>

          <div class="form-group">
            <label>Email</label>
            <input
              class="input"
              type="email"
              id="admin-email"
              placeholder="admin@example.com"
            />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input
              class="input"
              type="password"
              id="admin-password"
              placeholder="••••••••"
            />
          </div>
          <button class="btn btn-primary w-full" id="admin-login-btn" onclick="handleAdminLogin()">
            Login
          </button>
        </div>
      </div>
    </div>

    <!-- Admin Panel (shown once authenticated as admin/superAdmin) -->
    <div id="admin-panel" style="display: none">
      <div class="dashboard-header">
        <h3>Admin Panel</h3>
        <button class="btn btn-danger btn-sm" onclick="handleAdminLogout()">
          Logout
        </button>
      </div>

      <div class="dashboard-nav">
        <button id="atab-overview" class="dash-tab active" onclick="switchAdminTab('overview')">
          Overview
        </button>
        <button id="atab-vendors" class="dash-tab" onclick="switchAdminTab('vendors')">
          Vendors
        </button>
        <button id="atab-products" class="dash-tab" onclick="switchAdminTab('products')">
          Products
        </button>
        <button id="atab-services" class="dash-tab" onclick="switchAdminTab('services')">
          Services
        </button>
      </div>

      <div class="dashboard-content">
        <!-- Overview -->
        <div id="admin-overview">
          <div class="stat-grid">
            <div class="stat-card">
              <div class="stat-number" id="total-vendors">0</div>
              <div class="stat-label">Total Vendors</div>
            </div>
            <div class="stat-card">
              <div class="stat-number" id="active-vendors">0</div>
              <div class="stat-label">Active Vendors</div>
            </div>
            <div class="stat-card">
              <div class="stat-number" id="total-products">0</div>
              <div class="stat-label">Total Products</div>
            </div>
            <div class="stat-card">
              <div class="stat-number" id="total-services">0</div>
              <div class="stat-label">Total Services</div>
            </div>
          </div>

          <div class="section-title"><h3>Recent Payments</h3></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Vendor</th>
                  <th>Plan</th>
                  <th>Amount</th>
                  <th>Paid</th>
                </tr>
              </thead>
              <tbody id="payments-table"></tbody>
            </table>
          </div>
        </div>

        <!-- Vendors -->
        <div id="admin-vendors" style="display: none">
          <div class="search-bar">
            <input
              class="input"
              type="text"
              placeholder="Search vendors by name or email…"
              oninput="filterVendors(this.value)"
            />
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Vendor</th>
                  <th>Type</th>
                  <th>Status</th>
                  <th>Expires</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="vendors-table"></tbody>
            </table>
          </div>
        </div>

        <!-- Products -->
        <div id="admin-products" style="display: none">
          <div class="search-bar">
            <input
              class="input"
              type="text"
              placeholder="Search products by name or vendor…"
              oninput="filterProducts(this.value)"
            />
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Vendor</th>
                  <th>Price</th>
                  <th>Stock</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="products-table"></tbody>
            </table>
          </div>
        </div>

        <!-- Services -->
        <div id="admin-services" style="display: none">
          <div class="search-bar">
            <input
              class="input"
              type="text"
              placeholder="Search services by title or vendor…"
              oninput="filterServices(this.value)"
            />
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Service</th>
                  <th>Vendor</th>
                  <th>Category</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="services-table"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
